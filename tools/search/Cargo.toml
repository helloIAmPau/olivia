[package]
name = "search"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.60.0"
# waki is a reqwest-style HTTP client built on wasi:http/outgoing-handler, so it
# compiles for wasm32-wasip2 (reqwest's native/browser transports do not).
waki = { version = "0.5.1", features = ["json"] }
urlencoding = "2.1.3"

schemars = "1.2.2"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
