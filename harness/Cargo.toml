[package]
name = 'harness'
version = "0.0.1"
edition = '2024'

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = "1.2.2"
toml = "1.1.4"

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

reqwest = { version = "0.13.4", features = ["json"] }

axum = { version = "0.8.9", features = ["macros"] }

teloxide = { version = "0.17.0", features = ["macros"] }

tokio-cron-scheduler = "0.15.1"

uuid = { version = "1.24.0", features = ["v4", "serde"] }

wasmtime = { version = "47.0.3", features = ["component-model", "async"] }
wasmtime-wasi = "47.0.3"
wasmtime-wasi-http = "47.0.3"

# wasmtime-wasi-http does outbound TLS with rustls 0.23, which needs a crypto
# provider selected. Pull rustls in with the `ring` backend and install it as the
# process default in main() before any tool makes an HTTPS request.
rustls = { version = "0.23", features = ["ring"] }
