services:
  harness:
    image: 'olivia/harness:${VERSION:-0.0.0}-next'
    restart: 'always'
    build:
      context: '.'
      target: 'builder'
    ports:
      - '9000:9000'
    environment:
      - 'LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}'
      - 'OLIVIA_TOOL_BROWSERLESS_TOKEN=${BROWSERLESS_TOKEN}'
    configs:
      - source: 'test'
        target: '/config.toml'
    networks:
      - 'backend'
    depends_on:
      litellm:
        condition: 'service_healthy'
      tools-builder:
        condition: 'service_started'
      searxng:
        condition: 'service_healthy'
      postgres:
        condition: 'service_healthy'
      clickhouse:
        condition: 'service_healthy'
      rustfs:
        condition: 'service_healthy'
    volumes:
      - '.:/source'
      - './data/tools:/tools:ro'
      - './data/olivia/sandbox:/sandbox'
      - './examples:/examples:ro'
  tools-builder:
    image: 'olivia/tools:${VERSION:-0.0.0}-next'
    restart: 'always'
    build:
      context: '.'
      target: 'tools'
    networks:
      - 'backend'
    volumes:
      - '.:/source'
      - './data/tools:/tools'
  litellm:
    image: 'ghcr.io/berriai/litellm:v1.93.0'
    restart: 'always'
    configs:
      - source: 'litellm'
        target: '/config.yml'
    command:
      - '--config=/config.yml'
    environment:
      - 'LITELLM_LOG=WARNING'
      - 'LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}'
    networks:
      - 'backend'
      - 'llm'
    depends_on:
      ollama:
        condition: 'service_healthy'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'command -v curl > /dev/null 2>&1 || (apk update && apk add curl); curl -f http://localhost:4000/health/readiness || exit 1'
      interval: '60s'
      timeout: '5s'
      retries: 5
      start_period: '30s'
      start_interval: '3s'
  ollama:
    image: 'ollama/ollama:0.32.4'
    restart: 'always'
    deploy:
      resources:
        reservations:
          devices:
            - driver: 'nvidia'
              count: 'all'
              capabilities:
                - 'gpu'
    environment:
      - 'OLLAMA_DEBUG=false'
      - 'OLLAMA_DEBUG_LOG_REQUESTS=true'
      - 'OLLAMA_CONTEXT_LENGTH=64000'
    volumes:
      - './data/ollama:/root/.ollama'
    networks:
      - 'llm'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'command -v curl > /dev/null 2>&1 || (apt-get update && apt-get install -y curl); curl -f http://localhost:11434/ || exit 1'
      interval: '60s'
      timeout: '5s'
      retries: 5
      start_period: '30s'
      start_interval: '3s'
  searxng:
    image: 'ghcr.io/searxng/searxng:2026.8.4-c63835bd2'
    restart: 'always'
    configs:
      - source: 'searxng'
        target: '/etc/searxng/settings.yml'
    networks:
      - 'backend'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'wget -q --spider http://localhost:8080/healthz || exit 1'
      interval: '60s'
      timeout: '5s'
      retries: 5
      start_period: '30s'
      start_interval: '3s'
  postgres:
    image: 'postgres:17.6'
    restart: 'always'
    environment:
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_HOST_AUTH_METHOD=password'
    volumes:
      - './data/postgres:/var/lib/postgresql/data'
    networks:
      - 'backend'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1'
      interval: '60s'
      timeout: '5s'
      retries: 5
      start_period: '30s'
      start_interval: '3s'
  clickhouse:
    image: 'clickhouse/clickhouse-server:25.6'
    restart: 'always'
    environment:
      - 'CLICKHOUSE_USER=${CLICKHOUSE_USER}'
      - 'CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}'
      - 'CLICKHOUSE_DB=${CLICKHOUSE_DB}'
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - './data/clickhouse:/var/lib/clickhouse'
    networks:
      - 'backend'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1'
      interval: '60s'
      timeout: '5s'
      retries: 5
      start_period: '30s'
      start_interval: '3s'
  rustfs:
    image: 'rustfs/rustfs:latest'
    restart: 'always'
    environment:
      - 'RUSTFS_VOLUMES=/data/rustfs0'
      - 'RUSTFS_ADDRESS=0.0.0.0:9000'
      - 'RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}'
      - 'RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}'
      - 'RUSTFS_CONSOLE_ENABLE=false'
      - 'RUSTFS_CONSOLE_ENABLE=true'
    volumes:
      - './data/rustfs:/data'
    ports:
      - '9001:9001'
    user: 'root'
    networks:
      - 'backend'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'curl -fsS http://localhost:9000/health || exit 1'
      interval: '60s'
      timeout: '5s'
      retries: 5
      start_period: '30s'
      start_interval: '3s'
  browserless:
    image: 'ghcr.io/browserless/chromium:v2.55.3'
    environment:
      - 'TOKEN=${BROWSERLESS_TOKEN}'
    networks:
      - 'backend'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'curl -f "http://localhost:3000/pressure?token=$${TOKEN}" || exit 1'
      interval: '60s'
      timeout: '5s'
      retries: 5
      start_period: '30s'
      start_interval: '3s'

networks:
  backend:
  llm:

configs:
  searxng:
    content: |
      use_default_settings: true
      server:
        port: 8080
        bind_address: '0.0.0.0'
        secret_key: ${SEARXNG_TOKEN}
      search:
        safe_search: 0
        formats:
          - json
      use_default_settings:
        engines:
          remove:
            - 'wikidata'
  litellm:
    content: |
      model_list:
        - model_name: 'openai/gpt-4o'
          litellm_params:
            model: 'openai/gpt-4o'
            api_key: ${OPENAI_API_KEY}
        - model_name: 'anthropic/claude-sonnet-5'
          litellm_params:
            model: 'anthropic/claude-sonnet-5'
            api_key: ${OLIVIA_ANTHROPIC_KEY}
        - model_name: 'anthropic/claude-haiku-4-5'
          litellm_params:
            model: 'anthropic/claude-haiku-4-5'
            api_key: ${OLIVIA_ANTHROPIC_KEY}
        - model_name: 'ollama/qwen3.6'
          litellm_params:
            model: 'ollama/qwen3.6:27b'
            api_base: 'http://ollama:11434'
        - model_name: 'ollama/gemma4'
          litellm_params:
            model: 'ollama/gemma4:12b'
            api_base: 'http://ollama:11434'
  test:
#      [services.test_cron]
#      type = "cron"
#      schedule = "* 1/5 * * * *"
#      prompt = "Check the weather in milan"

    content: |
      [agent]
      model = "anthropic/claude-sonnet-5"
      prompt = "You must help us with some simple tasks"

      [agent.stores.default]
      type = "postgres"
      connection_string = "${POSTGRES_CONNECTION_STRING}"
      prompt = "This is the default storage for the agent. Every time you have to save something, feel free to create a new table and put data in it. You can reload information from there."

      [agent.stores.analytics]
      type = "clickhouse"
      host = "http://clickhouse:8123"
      username = "${CLICKHOUSE_USER}"
      password = "${CLICKHOUSE_PASSWORD}"
      prompt = "This is a column-oriented ClickHouse store for analytical workloads. Use it for large-scale aggregations, reporting and time-series style queries over immutable events rather than for row-level updates."

      [agent.stores.files]
      type = "s3"
      bucket = "${S3_BUCKET}"
      region = "us-east-1"
      endpoint = "http://rustfs:9000"
      access_key = "${RUSTFS_ACCESS_KEY}"
      secret_key = "${RUSTFS_SECRET_KEY}"
      prompt = "This is an S3-compatible object store for files and blobs. Use it to save, list, download and delete documents and other files rather than structured relational data."

      [services.test_bot]
      type = "telegram"
      token = "${OLIVIA_TELEGRAM_TOKEN}"
      prompt = "You received the message on Telegram. Please reply as naturally as possible."

      [services.test_http]
      type = "http"

      [services.test_http.endpoints.incoming_request]
      path = "/testolo"
      prompt = "You received the following message from the user. Please do something"

      [services.second_http]
      type = "http"
      port = 9000

      [services.second_http.endpoints.hello]
      method = "put"
      path = "/hello"
      prompt = "Generate a classic Hello Something using the content of the request"

      [services.second_http.endpoints.error]
      method = "post"
      path = "/error"
      prompt = "You must simulate a error flow. just return that you have failed for sbiridibory reason"

      [services.second_http.endpoints.loot]
      method = "post"
      path = "/loot"
      prompt = "Convert the argument uppercase. if it is already uppercase revert it"
