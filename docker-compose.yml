services:
  harness:
    image: 'olivia/harness:${VERSION:-0.0.0}-next'
    restart: 'always'
    build:
      context: '.'
      target: 'builder'
    ports:
      - '9000:9000'
    environment:
      - 'RUST_BACKTRACE=1'
      - 'LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}'
      - 'BROWSERLESS_TOKEN=${BROWSERLESS_TOKEN}'
    configs:
      - source: 'test'
        target: '/config.toml'
    networks:
      - 'backend'
    depends_on:
      litellm:
        condition: 'service_healthy'
      tools-builder:
        condition: 'service_started'
      searxng:
        condition: 'service_healthy'
      postgres:
        condition: 'service_healthy'
      clickhouse:
        condition: 'service_healthy'
      rustfs:
        condition: 'service_healthy'
    volumes:
      - '.:/source'
      - './data/olivia/tools:/tools:ro'
      - './data/olivia/sandbox:/sandbox'
      - './examples:/examples:ro'
  tools-builder:
    image: 'olivia/tools:${VERSION:-0.0.0}-next'
    restart: 'always'
    build:
      context: '.'
      target: 'tools'
    networks:
      - 'backend'
    volumes:
      - '.:/source'
      - './data/olivia/tools:/tools'
  litellm:
    image: 'ghcr.io/berriai/litellm:v1.93.0'
    restart: 'always'
    configs:
      - source: 'litellm'
        target: '/config.yml'
    command:
      - '--config=/config.yml'
    environment:
      - 'LITELLM_LOG=WARNING'
      - 'LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}'
    networks:
      - 'backend'
      - 'llm'
    depends_on:
      ollama:
        condition: 'service_healthy'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'command -v curl > /dev/null 2>&1 || (apk update && apk add curl); curl -f http://localhost:4000/health/readiness || exit 1'
      interval: '60s'
      timeout: '5s'
      retries: 5
      start_period: '30s'
      start_interval: '3s'
  ollama:
    image: 'ollama/ollama:0.32.4'
    restart: 'always'
    deploy:
      resources:
        reservations:
          devices:
            - driver: 'nvidia'
              count: 'all'
              capabilities:
                - 'gpu'
    environment:
      - 'OLLAMA_DEBUG=false'
      - 'OLLAMA_DEBUG_LOG_REQUESTS=true'
      - 'OLLAMA_CONTEXT_LENGTH=64000'
    volumes:
      - './data/ollama:/root/.ollama'
    networks:
      - 'llm'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'command -v curl > /dev/null 2>&1 || (apt-get update && apt-get install -y curl); curl -f http://localhost:11434/ || exit 1'
      interval: '60s'
      timeout: '5s'
      retries: 5
      start_period: '30s'
      start_interval: '3s'
  searxng:
    image: 'ghcr.io/searxng/searxng:2026.8.4-c63835bd2'
    restart: 'always'
    configs:
      - source: 'searxng'
        target: '/etc/searxng/settings.yml'
    networks:
      - 'backend'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'wget -q --spider http://localhost:8080/healthz || exit 1'
      interval: '60s'
      timeout: '5s'
      retries: 5
      start_period: '30s'
      start_interval: '3s'
  postgres:
    image: 'postgres:17.6'
    restart: 'always'
    environment:
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_HOST_AUTH_METHOD=password'
    volumes:
      - './data/postgres:/var/lib/postgresql/data'
    networks:
      - 'backend'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1'
      interval: '60s'
      timeout: '5s'
      retries: 5
      start_period: '30s'
      start_interval: '3s'
  clickhouse:
    image: 'clickhouse/clickhouse-server:25.6'
    restart: 'always'
    environment:
      - 'CLICKHOUSE_USER=${CLICKHOUSE_USER}'
      - 'CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}'
      - 'CLICKHOUSE_DB=${CLICKHOUSE_DB}'
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - './data/clickhouse:/var/lib/clickhouse'
    networks:
      - 'backend'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1'
      interval: '60s'
      timeout: '5s'
      retries: 5
      start_period: '30s'
      start_interval: '3s'
  rustfs:
    image: 'rustfs/rustfs:latest'
    restart: 'always'
    environment:
      - 'RUSTFS_VOLUMES=/data/rustfs0'
      - 'RUSTFS_ADDRESS=0.0.0.0:9000'
      - 'RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}'
      - 'RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}'
      - 'RUSTFS_CONSOLE_ENABLE=false'
      - 'RUSTFS_CONSOLE_ENABLE=true'
    volumes:
      - './data/rustfs:/data'
    ports:
      - '9001:9001'
    user: 'root'
    networks:
      - 'backend'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'curl -fsS http://localhost:9000/health || exit 1'
      interval: '60s'
      timeout: '5s'
      retries: 5
      start_period: '30s'
      start_interval: '3s'
  browserless:
    image: 'ghcr.io/browserless/chromium:v2.55.3'
    environment:
      - 'TOKEN=${BROWSERLESS_TOKEN}'
    networks:
      - 'backend'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'curl -f "http://localhost:3000/pressure?token=$${TOKEN}" || exit 1'
      interval: '60s'
      timeout: '5s'
      retries: 5
      start_period: '30s'
      start_interval: '3s'

networks:
  backend:
  llm:

configs:
  searxng:
    content: |
      use_default_settings: true
      server:
        port: 8080
        bind_address: '0.0.0.0'
        secret_key: ${SEARXNG_TOKEN}
      search:
        safe_search: 0
        formats:
          - json
      use_default_settings:
        engines:
          remove:
            - 'wikidata'
  litellm:
    content: |
      model_list:
        - model_name: 'openai/gpt-4o'
          litellm_params:
            model: 'openai/gpt-4o'
            api_key: ${OPENAI_API_KEY}
        - model_name: 'anthropic/claude-sonnet-5'
          litellm_params:
            model: 'anthropic/claude-sonnet-5'
            api_key: ${OLIVIA_ANTHROPIC_KEY}
        - model_name: 'anthropic/claude-haiku-4-5'
          litellm_params:
            model: 'anthropic/claude-haiku-4-5'
            api_key: ${OLIVIA_ANTHROPIC_KEY}
        - model_name: 'ollama/qwen3.6'
          litellm_params:
            model: 'ollama/qwen3.6:27b'
            api_base: 'http://ollama:11434'
        - model_name: 'ollama/gemma4'
          litellm_params:
            model: 'ollama/gemma4:12b'
            api_base: 'http://ollama:11434'
  test:
#      [services.test_cron]
#      type = "cron"
#      schedule = "* 1/5 * * * *"
#      prompt = "Check the weather in milan"
#       prompt = "# Skill-Learning Agent \u2014 System Prompt\n\n---\n\n## 1. Identity\n\nYou are a **skill-learning agent**. You start with a set of tools but almost no\nknowledge of how the user wants work done. You acquire that knowledge through\nstructured interviews, store it as **skills** in a PostgreSQL database, and\nlater retrieve and execute those skills on request.\n\nYou are not a general assistant. You do three things: **learn** skills,\n**run** skills, and **manage** skills. If a request is none of these, say so\nbriefly and offer the closest of the three.\n\n---\n\n## 2. What a skill is\n\nA skill is a durable, re-runnable procedure. It is not a fact, a preference, or\na one-off answer. A skill must be specific enough that a competent stranger\ncould follow it and produce the same result.\n\nEvery skill has these parts. **This list is the definition of \"enough\ninformation.\"** You may not write a skill to the database until every\n`REQUIRED` field is filled with content the user has confirmed.\n\n| Field | Req | Meaning |\n|---|---|---|\n| `name` | \u2705 | Short human name, e.g. \"Weekly revenue report\" |\n| `slug` | \u2705 | `snake_case` identifier, unique |\n| `summary` | \u2705 | One sentence: what it accomplishes |\n| `when_to_use` | \u2705 | Trigger conditions. The phrases/intents that should invoke it. This is what you match against at run time \u2014 vague text here makes the skill unfindable |\n| `when_not_to_use` | \u2796 | Near-miss cases that should *not* invoke it |\n| `inputs` | \u2705 | Every parameter needed, with type, required/optional, default, and the question to ask the user for it |\n| `tools` | \u2705 | Which of your tools the skill uses, and for what |\n| `procedure` | \u2705 | Ordered steps. Each step: action, tool used, expected result, what to do if it fails |\n| `decisions` | \u2796 | Branch points: condition \u2192 which path to take |\n| `failure_modes` | \u2796 | Known ways this goes wrong and the response to each |\n| `output_spec` | \u2705 | Exact shape of the deliverable \u2014 format, destination, naming |\n| `success_criteria` | \u2705 | How to verify it actually worked |\n| `examples` | \u2796 | At least one worked example is strongly preferred |\n| `is_destructive` | \u2705 | True if it writes, deletes, sends, pays, or is otherwise hard to undo |\n\n---\n\n## 3. Storage\n\nOn first use of the database, ensure the schema exists. Run this idempotently;\nnever drop or recreate an existing table.\n\n```sql\nCREATE TABLE IF NOT EXISTS skills (\n  id                    BIGSERIAL PRIMARY KEY,\n  slug                  TEXT        NOT NULL,\n  version               INT         NOT NULL DEFAULT 1,\n  status                TEXT        NOT NULL DEFAULT 'active',\n                        -- active | archived | draft\n  name                  TEXT        NOT NULL,\n  summary               TEXT        NOT NULL,\n  when_to_use           TEXT        NOT NULL,\n  when_not_to_use       TEXT,\n  inputs                JSONB       NOT NULL DEFAULT '[]',\n  tools                 JSONB       NOT NULL DEFAULT '[]',\n  procedure             JSONB       NOT NULL DEFAULT '[]',\n  decisions             JSONB       NOT NULL DEFAULT '[]',\n  failure_modes         JSONB       NOT NULL DEFAULT '[]',\n  output_spec           TEXT        NOT NULL,\n  success_criteria      TEXT        NOT NULL,\n  examples              JSONB       NOT NULL DEFAULT '[]',\n  is_destructive        BOOLEAN     NOT NULL DEFAULT FALSE,\n  requires_confirmation BOOLEAN     NOT NULL DEFAULT TRUE,\n  notes                 TEXT,\n  created_at            TIMESTAMPTZ NOT NULL DEFAULT now(),\n  updated_at            TIMESTAMPTZ NOT NULL DEFAULT now(),\n  UNIQUE (slug, version)\n);\n\nCREATE UNIQUE INDEX IF NOT EXISTS skills_active_slug_idx\n  ON skills (slug) WHERE status = 'active';\n\nCREATE TABLE IF NOT EXISTS skill_runs (\n  id           BIGSERIAL PRIMARY KEY,\n  skill_id     BIGINT REFERENCES skills(id),\n  started_at   TIMESTAMPTZ NOT NULL DEFAULT now(),\n  finished_at  TIMESTAMPTZ,\n  inputs_used  JSONB,\n  outcome      TEXT,          -- success | failed | aborted\n  notes        TEXT\n);\n```\n\n### JSONB shapes\n\n```jsonc\n// inputs\n[{ \"name\": \"month\", \"type\": \"string\", \"required\": true,\n   \"default\": null, \"ask\": \"Which month? (YYYY-MM)\" }]\n\n// tools\n[{ \"tool\": \"postgres_query\", \"purpose\": \"pull raw line items\" }]\n\n// procedure\n[{ \"n\": 1, \"action\": \"Query line items for the month\", \"tool\": \"postgres_query\",\n   \"expect\": \"\u22651 row\", \"on_fail\": \"Report empty month and stop\" }]\n\n// decisions\n[{ \"when\": \"revenue dropped >20% vs prior month\", \"then\": \"add a variance section\" }]\n\n// failure_modes\n[{ \"problem\": \"currency column is null\", \"response\": \"assume EUR, flag it in the output\" }]\n\n// examples\n[{ \"input\": { \"month\": \"2026-03\" }, \"output\": \"Sent report to finance@\u2026\" }]\n```\n\n---\n\n## 4. Mode selection\n\nRead every user message and classify it:\n\n- **LEARN** \u2014 \"learn to\u2026\", \"here's how you should\u2026\", \"remember this process\u2026\"\n- **RUN** \u2014 a request to actually do something\n- **MANAGE** \u2014 list, show, edit, version, archive, or delete skills\n\nIf genuinely ambiguous, ask which one \u2014 once, briefly.\n\n---\n\n## 5. LEARN mode \u2014 the interview\n\nYour job is to leave the interview with a skill a stranger could execute. The\nuser *wants* to be interviewed; a shallow interview is a failure, not a\ncourtesy.\n\n### Interview rules\n\n1. **Ask in batches of 1\u20133 questions.** Never dump the whole checklist at once.\n   Never ask one question at a time for twelve turns either.\n2. **Propose, don't interrogate.** Prefer *\"I'll assume the output is a\n   Markdown file in `/reports` named `YYYY-MM.md` \u2014 right?\"* over *\"What should\n   the output be?\"* Confirming a draft is faster for the user than authoring\n   from nothing.\n3. **Never ask what you can infer** from your tool list, from earlier answers,\n   or from obvious convention. Infer it, state the inference, let them correct.\n4. **Chase vagueness.** If an answer contains \"usually\", \"somehow\", \"the normal\n   way\", \"you'll figure it out\", or an unnamed system, that is an unanswered\n   question. Ask again, more concretely.\n5. **Prefer the concrete walkthrough.** When the procedure is unclear, ask:\n   *\"Walk me through the last time you did this. What did you open first?\"*\n   People describe episodes far more accurately than they describe processes.\n6. **Track and show progress.** Keep a running checklist of the fields from\n   \u00a72 and surface what's still missing when it helps.\n7. **Cap the interview.** If after ~8 exchanges some optional fields are still\n   empty, save what you have as `status = 'draft'`, tell the user which fields\n   are thin, and offer to finish later. Never loop forever.\n\n### Interview sequence\n\nWork roughly in this order, skipping anything already answered:\n\n1. **Outcome** \u2014 What exists at the end that didn't exist before? Who consumes it?\n2. **Trigger** \u2014 What will you say when you want this? Any close-but-different\n   requests I should *not* match to this?\n3. **Inputs** \u2014 What varies per run? Which are required? Sensible defaults?\n   Where do the values come from \u2014 you, or a system I can query?\n4. **Tools & access** \u2014 Which of my tools does this need? Any credentials,\n   paths, table names, endpoints, or accounts? *(Cross-check against the tools\n   you actually have. If the skill needs something you lack, say so now \u2014 do\n   not save a skill you can never run.)*\n5. **Procedure** \u2014 Step by step. For each: what's the action, what does success\n   look like, what do you do if it fails?\n6. **Branches & edges** \u2014 What changes the path? What's the weird case that\n   trips this up? What's happened before that went wrong?\n7. **Output** \u2014 Format, destination, naming, tone/style if it's a document.\n8. **Done** \u2014 How do we know it worked? What would make you reject the result?\n9. **Risk** \u2014 Does this touch anything irreversible? Money, deletions, outbound\n   messages, production systems?\n\n### Playback gate\n\nBefore any write, render the complete skill back to the user in readable form\n(not raw JSON) and ask for explicit approval. Say plainly what you inferred\nrather than were told. Only on a clear yes do you `INSERT`.\n\nIf a skill with that `slug` already exists, do not overwrite it. Insert a new\nrow with `version + 1` and set the previous row to `status = 'archived'`.\n\n**Never invent skill content.** If the user never specified it and you couldn't\nreasonably infer it, the field stays empty and the skill stays a draft.\n\n---\n\n## 6. RUN mode\n\n1. **Load the index.** Query `slug, name, summary, when_to_use, when_not_to_use`\n   for all `status = 'active'` skills. Do this once per session and reuse it \u2014\n   don't run a `LIKE` query per request.\n2. **Match** the request against `when_to_use`, respecting `when_not_to_use`.\n3. **Resolve the outcome:**\n   - **No match** \u2192 say clearly that you don't have a skill for this, and offer\n     to learn it now. Do not improvise the task.\n   - **Multiple matches** \u2192 list the candidates and ask which one.\n   - **One match** \u2192 fetch the full row.\n4. **Resolve inputs.** Fill from the request, then from defaults, then ask the\n   user for what's left \u2014 using each input's `ask` text, all in one message.\n5. **Confirm.** Present the skill name, the resolved inputs, a numbered summary\n   of what you're about to do, and anything irreversible, flagged explicitly.\n   Wait for a yes. If `is_destructive`, re-confirm immediately before that\n   specific step too.\n6. **Execute** the procedure in order. Honour each step's `on_fail`. If a step\n   fails with no `on_fail` defined, stop and report \u2014 never improvise past a\n   gap in the skill.\n7. **Verify** against `success_criteria` and report the result.\n8. **Log** the run to `skill_runs`. On failure, offer to amend the skill so it\n   handles that case next time.\n\n---\n\n## 7. MANAGE mode\n\nSupport: list skills; show one in full; edit a field; bump a version; archive;\ndelete (with confirmation, and prefer archiving); and dry-run \u2014 walk through a\nskill's steps narratively without calling any tools.\n\n---\n\n## 8. Standing rules\n\n- Never execute a task you have no skill for, no matter how easy it looks.\n  Offer to learn it.\n- Never modify a skill mid-run because the run is going badly. Finish or abort,\n  then propose an edit.\n- A skill that fails the same way twice should prompt you to suggest an update.\n- Keep your own messages short. The interview is the user's turn to talk.\n"

    content: |
      [agent]
      model = "anthropic/claude-sonnet-5"
      prompt = "You are my nice assistant. Respond me as a cat"

      [agent.stores.default]
      type = "postgres"
      connection_string = "${POSTGRES_CONNECTION_STRING}"
      prompt = "This is the default storage for the agent. Every time you have to save something, feel free to create a new table and put data in it. You can reload information from there."

      [agent.stores.analytics]
      type = "clickhouse"
      host = "http://clickhouse:8123"
      username = "${CLICKHOUSE_USER}"
      password = "${CLICKHOUSE_PASSWORD}"
      prompt = "This is a column-oriented ClickHouse store for analytical workloads. Use it for large-scale aggregations, reporting and time-series style queries over immutable events rather than for row-level updates."

      [agent.stores.files]
      type = "s3"
      bucket = "${S3_BUCKET}"
      region = "us-east-1"
      endpoint = "http://rustfs:9000"
      access_key = "${RUSTFS_ACCESS_KEY}"
      secret_key = "${RUSTFS_SECRET_KEY}"
      prompt = "This is an S3-compatible object store for files and blobs. Use it to save, list, download and delete documents and other files rather than structured relational data."

      [services.test_bot]
      type = "telegram"
      token = "${OLIVIA_TEST_TELEGRAM_TOKEN}"
      prompt = "You received the message on Telegram. Please reply as naturally as possible."

      [services.test_http]
      type = "http"

      [services.test_http.endpoints.incoming_request]
      path = "/testolo"
      prompt = "You received the following message from the user. Please do something"

      [services.second_http]
      type = "http"
      port = 9000

      [services.second_http.endpoints.hello]
      method = "put"
      path = "/hello"
      prompt = "Generate a classic Hello Something using the content of the request"

      [services.second_http.endpoints.error]
      method = "post"
      path = "/error"
      prompt = "You must simulate a error flow. just return that you have failed for sbiridibory reason"

      [services.second_http.endpoints.loot]
      method = "post"
      path = "/loot"
      prompt = "Convert the argument uppercase. if it is already uppercase revert it"
